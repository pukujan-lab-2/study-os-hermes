# The web version behind a Cloudflare tunnel. Secrets live in env files next to this, never in it.
name: study-os-try
services:
  web:
    build: { context: .., dockerfile: web/Dockerfile }
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1500m
    cpus: 3
    pids_limit: 600
    env_file: [../../try.env]
    environment:
      WEB_DATA: /data
      WEB_SITE: /site
      WEB_ORIGIN: https://hackathon.design-bakery.com
      CLAUDE_LEASE_FILE: /run/claude-lease.json
      STUDYOS_MODEL_NAME: claude-sonnet-5-5
    volumes:
      - ../../data:/data
      - ../../site:/site:ro
      - ${CLAUDE_LEASE}:/run/claude-lease.json:ro
    networks: [edge]
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes: ["../../tunnel:/etc/cloudflared:ro"]
    networks: [edge]
    depends_on: [web]
networks:
  edge: {}
